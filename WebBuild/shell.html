<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this a phone lays the page out at a ~980px virtual viewport and
     scales the result down, so the canvas is wrong from the first frame and a
     double-tap zoom sits in front of every button. It also switches the
     browser out of the legacy 300ms click delay. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Blocks 5">
<title>Blocks 5</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<!-- iOS ignores the manifest icons and any transparency; this one is opaque. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Selectors are written "div#name" rather than "#name" on purpose: emcc runs
     a shell file through its own preprocessor, which reads a line beginning
     with a hash as a directive. */
  html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
  body {
    /* A finger belongs to the game, not to the browser's own gestures: no
       scrolling, no pull-to-refresh, no pinch zoom, no text selection and no
       grey flash on tap. This is the half of "buttons are hard to hit" that
       costs nothing to fix. */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    color: #cfcfcf;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* The canvas must carry no border and no padding, or every mouse coordinate
     SDL reports is offset from the point the player aimed at. */
  canvas { display: block; width: 100%; height: 100%; border: 0; background: #000; touch-action: none; }

  div#b5_boot {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; transition: opacity .4s;
  }
  /* The whole boot screen is pixel art, because the game behind it is. The icon
     is a 6x replication of a 32x32 drawing, so it is shown at an integer
     multiple of 32 and told not to be resampled; the bar is drawn in whole
     blocks; and the line of text is the game's own font, blown up the same way
     (see drawMessage). */
  /* The direct child only - the line of text is an img too, one level down,
     and must keep the size drawMessage gives it. */
  div#b5_boot > img {
    width: 160px; max-width: 60vw; margin-bottom: 20px;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* No rounded corners and no transition: a block appears or it does not. The
     9-on-3-off gradient is what makes the fill look like discrete cells; the
     track's own width is set in JS to a whole number of them, so a full bar
     ends flush with its right edge instead of on a gap. */
  div#b5_bar {
    width: 237px; max-width: 70vw; height: 12px; background: #1a1a1a;
    box-shadow: 0 0 0 3px #3a3a3a; overflow: hidden;
  }
  div#b5_bar > i {
    display: block; height: 100%; width: 0;
    background: repeating-linear-gradient(90deg, #f0a000 0 9px, transparent 9px 12px);
  }
  div#b5_msg { margin-top: 20px; }
  div#b5_msg img { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

<!-- Fourteen megabytes take a while on a phone, and until main() runs there is
     nothing on the canvas but black. This says what is happening and then gets
     out of the way; the game has a loading screen of its own behind it. -->
<div id="b5_boot">
  <img src="icon-192.png" alt="Blocks 5">
  <div id="b5_bar"><i></i></div>
  <div id="b5_msg"></div>
</div>

<script>
(function () {
  var boot = document.getElementById('b5_boot');
  var bar  = document.querySelector('div#b5_bar > i');
  var msg  = document.getElementById('b5_msg');
  var gone = false;

  function hideBoot() {
    if (gone || !boot) return;
    gone = true;
    boot.style.opacity = '0';
    setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 450);
  }

  // German or English, by the same rule the game uses in
  // Engine::detectSystemLanguage: walk navigator.languages and take the first
  // tag that is one or the other. Only those two exist - of the 349 strings in
  // data/languages.txt exactly one has a French body and one a Spanish - so
  // everything else is English.
  var german = (function () {
    var list = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < list.length; i++) {
      var tag = String(list[i] || '').toLowerCase();
      if (tag.indexOf('de') === 0) return true;
      if (tag.indexOf('en') === 0) return false;
    }
    return false;
  })();

  // The line is the game's own $LOADING, drawn in the game's own font: the page
  // stands before data.zip and before any GL context, so it cannot render that
  // font itself. build.sh does it instead (WebBuild/make_text.py) and stamps the
  // two images in here, in their real pixels, which this then blows up by a
  // whole factor. Same rule as the icons - replication at an integer factor,
  // never a resize - and one fewer request than a file would cost.
  var TEXTS = %%LOADTEXT%%;
  var MESSAGE = TEXTS[german ? 'de' : 'en'];
  var GAP_ABOVE = 20;               // same as div#b5_msg { margin-top }

  function drawMessage(t) {
    if (!t) return;
    // Whole factors only, and only as far as the line may be wide: on a narrow
    // phone, smaller rather than resampled.
    var scale = Math.max(1, Math.min(3, Math.floor((window.innerWidth - 24) / t.w)));
    var img = new Image();
    img.src = 'data:image/png;base64,' + t.d;
    img.style.width = (t.w * scale) + 'px';
    img.style.height = (t.h * scale) + 'px';
    img.alt = '';
    msg.textContent = '';
    msg.appendChild(img);

    // The glyphs start t rows below the top edge of the image, and that gap
    // grows with the scale. Left alone it makes the space above the line look
    // wider than the one under Bob, so Bob gets the same amount added rather
    // than the line being pulled up.
    var icon = document.querySelector('div#b5_boot > img');
    if (icon) icon.style.marginBottom = (GAP_ABOVE + t.t * scale) + 'px';
  }

  // The bar fills in whole blocks rather than continuously. n blocks carry only
  // n-1 gaps, so the track is sized to that and not to a round 240: otherwise a
  // full bar stops three pixels short of its own right edge, on the gap that
  // belongs after the last block.
  var BLOCK = 9, GAP = 3, CELL = BLOCK + GAP;
  var BAR_MAX = 240;
  var progress = 0;

  function setProgress(fraction) {
    progress = Math.max(0, Math.min(1, fraction));
    var room = Math.min(BAR_MAX, Math.floor(window.innerWidth * 0.7));
    var cells = Math.max(1, Math.floor((room + GAP) / CELL));
    var filled = Math.round(progress * cells);
    bar.parentNode.style.width = (cells * CELL - GAP) + 'px';
    bar.style.width = (filled > 0 ? filled * CELL - GAP : 0) + 'px';
  }

  // Emscripten reports progress as "Preparing... (3/7)" and ends with an empty
  // string when everything is in.
  function setStatus(text) {
    if (gone) return;
    if (!text) { hideBoot(); return; }
    var m = text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
    if (m) {
      var all = parseFloat(m[3]);
      if (all > 0) setProgress(parseFloat(m[1]) / all);
    }
    drawMessage(MESSAGE);
  }

  // build.sh stempelt hier die Kennung des Builds hinein. blocks5.js sucht
  // seine beiden grossen Nachbarn ueber locateFile, also genuegt dieser eine
  // Ort, damit alle drei Dateien den Namen desselben Baus tragen.
  var B5_BUILD = '%%BUILD%%';

  var Module = {
    canvas: document.getElementById('canvas'),
    locateFile: function (path) {
      return (B5_BUILD && B5_BUILD.charAt(0) !== '%')
             ? path.replace(/^blocks5\./, 'blocks5-' + B5_BUILD + '.')
             : path;
    },
    setStatus: setStatus,
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      setStatus(left ? '(' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
    }
  };
  Module['postRun'] = [hideBoot];
  window.Module = Module;

  // Emscripten takes a moment to report the first status, and the line should
  // not be empty until then. Turning the device recomputes both, since the
  // scale and the block count depend on the width.
  drawMessage(MESSAGE);
  setProgress(0);
  window.addEventListener('resize', function () {
    if (gone) return;
    setProgress(progress);
    drawMessage(MESSAGE);
  });

  // Losing the GL context is a real event on a phone: the browser may drop it
  // while the tab is in the background. The game cannot rebuild its textures,
  // the framebuffer object and the two shader programs from where it stands,
  // so say what happened rather than leaving a frozen picture. An alert(),
  // which is what Emscripten's own shell does here, cannot be dismissed on a
  // phone without losing the page anyway.
  Module.canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;left:0;top:0;right:0;bottom:0;background:#000;' +
                            'display:flex;align-items:center;justify-content:center;' +
                            'text-align:center;padding:24px;font-size:16px;color:#cfcfcf');
    d.textContent = 'The graphics context was lost. Please reload the page.';
    d.addEventListener('click', function () { location.reload(); });
    document.body.appendChild(d);
  }, false);

  // index.html is what ships; the test harness loads blocks5.html. Registering
  // the worker only for the former keeps a 14 MB precache out of every test
  // run - and out of the way of a build that has just been replaced.
  if ('serviceWorker' in navigator && !/blocks5\.html$/.test(location.pathname)) {
    window.addEventListener('load', function () {
      // updateViaCache "none": the worker script itself must never come out of
      // the HTTP cache, or a stale sw.js keeps serving a stale payload and the
      // page can never learn that a new build exists.
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        // And ask straight away whether a newer one exists. The browser is
        // supposed to check this on every navigation, but how soon it really
        // does is its own business - measured here, a reload onto a new build
        // left the old worker in place for over half a minute. The page itself
        // is already current at that point, because index.html is fetched from
        // the network; it is the offline copy that would lag behind.
        if (reg && reg.update) reg.update().catch(function () {});
      }).catch(function (e) {
        console.warn('[blocks5] service worker registration failed:', e);
      });
    });
  }
})();
</script>
<!-- Die Bildschirmsteuerung. Eine gewoehnliche Seiten-Datei, kein Teil der
     gestempelten Nutzlast: sie schickt nur Tastenereignisse und weiss vom
     Spiel nichts. ?pad=on erzwingt sie, ?pad=off schaltet sie ab. -->
<script src="touch_controls.js"></script>
{{{ SCRIPT }}}
</body>
</html>
